<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora - Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#0b0f1a] text-white">

<!-- NAV -->
<header class="flex justify-between items-center px-10 py-6">
  <h1 class="text-xl font-bold tracking-wide">NEXORA</h1>
  <nav class="flex gap-6 text-sm text-gray-300">
    <a href="dashboard.html" class="hover:text-white">Home</a>
    <a href="features.html" class="hover:text-white">Features</a>
    <a href="pricing.html" class="hover:text-white">Pricing</a>
    <a href="contact.html" class="hover:text-white">Contact</a>
  </nav>
</header>

<!-- WORKSPACE SECTION -->
<section class="text-center py-28 px-6 relative">
  <div class="absolute inset-0 bg-gradient-to-r from-blue-600/20 via-purple-600/10 to-cyan-500/20 blur-3xl"></div>

  <h2 class="text-5xl font-extrabold leading-tight relative">
    Welcome to the <span class="text-blue-400">Workspace</span>
  </h2>

  <div id="content" class="mt-8 relative">
    <p class="text-gray-400">Loading...</p>
  </div>
</section>

    <script>
        async function exchangeCodeForToken(code, codeVerifier) {
            const clientId = '1501107942399938640';
            const redirectUri = window.location.origin + '/workspace.html';

            const response = await fetch('https://discord.com/api/oauth2/token', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams({
                    client_id: clientId,
                    grant_type: 'authorization_code',
                    code: code,
                    redirect_uri: redirectUri,
                    code_verifier: codeVerifier,
                }),
            });

            if (!response.ok) {
                throw new Error('Failed to exchange code for token');
            }

            return await response.json();
        }

        async function getUserInfo(accessToken) {
            const response = await fetch('https://discord.com/api/users/@me', {
                headers: {
                    Authorization: `Bearer ${accessToken}`,
                },
            });

            if (!response.ok) {
                throw new Error('Failed to get user info');
            }

            return await response.json();
        }

        async function main() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');

            if (!code) {
                document.getElementById('content').innerHTML = '<p class="text-gray-400">No authorization code found. Please verify your Discord account from <a href="verify.html" class="text-blue-400 hover:underline">verify.html</a>.</p>';
                return;
            }

            const codeVerifier = sessionStorage.getItem('code_verifier');
            if (!codeVerifier) {
                document.getElementById('content').innerHTML = '<p class="text-red-400">Error: Code verifier not found. Please start the verification process from <a href="verify.html" class="text-blue-400 hover:underline">verify.html</a>.</p>';
                return;
            }

            try {
                const tokenData = await exchangeCodeForToken(code, codeVerifier);
                const user = await getUserInfo(tokenData.access_token);

                const avatarUrl = user.avatar ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png` : 'https://cdn.discordapp.com/embed/avatars/0.png';

                document.getElementById('content').innerHTML = `
                    <div class="max-w-md mx-auto p-6 bg-white/5 border border-white/10 rounded-2xl">
                        <img src="${avatarUrl}" alt="Avatar" class="w-24 h-24 rounded-full mx-auto mb-4">
                        <h3 class="text-2xl font-semibold">Hello ${user.username}!</h3>
                        <p class="text-gray-400 mt-2">Discord ID: ${user.id}</p>
                    </div>
                `;

                // Clear the code from URL
                window.history.replaceState({}, document.title, window.location.pathname);

            } catch (error) {
                console.error(error);
                document.getElementById('content').innerHTML = '<p class="text-red-400">Error during verification. Please try again.</p>';
            }
        }

        main();
    </script>
</body>
</html>
