<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora - Verify with Discord</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#0b0f1a] text-white">

<!-- NAV -->
<header class="flex justify-between items-center px-10 py-6">
  <h1 class="text-xl font-bold tracking-wide">NEXORA</h1>
  <nav class="flex gap-6 text-sm text-gray-300">
    <a href="dashboard.html" class="hover:text-white">Home</a>
    <a href="features.html" class="hover:text-white">Features</a>
    <a href="pricing.html" class="hover:text-white">Pricing</a>
    <a href="contact.html" class="hover:text-white">Contact</a>
  </nav>
</header>

<!-- VERIFY SECTION -->
<section class="text-center py-28 px-6 relative">
  <div class="absolute inset-0 bg-gradient-to-r from-blue-600/20 via-purple-600/10 to-cyan-500/20 blur-3xl"></div>

  <h2 class="text-5xl font-extrabold leading-tight relative">
    Verify with <span class="text-blue-400">Discord</span>
  </h2>

  <p class="mt-6 text-gray-400 max-w-xl mx-auto relative">
    Connect your Discord account to access the workspace.
  </p>

  <div class="mt-8 flex justify-center relative">
    <button id="verifyBtn" class="px-6 py-3 bg-blue-600 hover:bg-blue-500 rounded-xl font-medium">
      Verify with Discord
    </button>
  </div>
</section>

    <script>
        // Generate a random string for code_verifier
        function generateRandomString(length) {
            const array = new Uint8Array(length);
            window.crypto.getRandomValues(array);
            return Array.from(array, byte => byte.toString(16).padStart(2, '0')).join('');
        }

        // Base64 URL encode
        function base64URLEncode(str) {
            return btoa(str)
                .replace(/\+/g, '-')
                .replace(/\//g, '_')
                .replace(/=/g, '');
        }

        // SHA256 hash
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            return new Uint8Array(hashBuffer);
        }

        document.getElementById('verifyBtn').addEventListener('click', async () => {
            const clientId = '1501107942399938640';
            const redirectUri = window.location.origin + '/workspace.html'; // Assuming hosted at root
            const scope = 'identify';

            const codeVerifier = generateRandomString(32);
            const codeChallenge = base64URLEncode(String.fromCharCode(...await sha256(codeVerifier)));

            // Store code_verifier in sessionStorage
            sessionStorage.setItem('code_verifier', codeVerifier);

            const authUrl = `https://discord.com/api/oauth2/authorize?client_id=${clientId}&redirect_uri=${encodeURIComponent(redirectUri)}&response_type=code&scope=${scope}&code_challenge=${codeChallenge}&code_challenge_method=S256`;

            window.location.href = authUrl;
        });
    </script>

</body>
</html>
