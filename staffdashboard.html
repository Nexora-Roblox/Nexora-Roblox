<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexora Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Inter", sans-serif;
}

body {
    display: flex;
    background: #f8fafc;
    color: #0f172a;
}

/* Sidebar */
.sidebar {
    width: 240px;
    height: 100vh;
    background: #ffffff;
    border-right: 1px solid #e2e8f0;
    padding: 25px;
}

.logo {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 40px;
    color: #2563eb;
}

.sidebar a {
    display: block;
    text-decoration: none;
    color: #64748b;
    margin: 15px 0;
    font-weight: 500;
    transition: 0.2s;
}

.sidebar a:hover {
    color: #2563eb;
}

/* Main */
.main {
    flex: 1;
    padding: 30px;
}

/* Topbar */
.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

.topbar h1 {
    font-size: 26px;
    font-weight: 600;
}

.user {
    background: #ffffff;
    padding: 10px 16px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    font-weight: 500;
}

/* Cards */
.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 20px;
}

.card {
    background: #ffffff;
    padding: 22px;
    border-radius: 18px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    transition: 0.2s;
}

.card:hover {
    transform: translateY(-5px);
}

.card h3 {
    font-size: 14px;
    color: #64748b;
    margin-bottom: 10px;
}

.card p {
    font-size: 28px;
    font-weight: 600;
}

/* Chart */
.chart {
    margin-top: 30px;
    background: #ffffff;
    border-radius: 18px;
    padding: 25px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    height: 320px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #94a3b8;
}
</style>
</head>

<body>

<div class="sidebar">
    <div class="logo">Nexora</div>
    <a href="#">Dashboard</a>
    <a href="#">Analytics</a>
    <a href="#">Users</a>
    <a href="#">Settings</a>
</div>

<div class="main">
    
    <div class="topbar">
        <h1>Nexora Dashboard</h1>
        <div class="user">Admin</div>
    </div>

    <div class="cards">
        <div class="card">
            <h3>Total Users</h3>
            <p>1,245</p>
        </div>
        <div class="card">
            <h3>Revenue</h3>
            <p>$8,430</p>
        </div>
        <div class="card">
            <h3>Orders</h3>
            <p>320</p>
        </div>
        <div class="card">
            <h3>Growth</h3>
            <p style="color:#16a34a;">+12%</p>
        </div>
    </div>


</div>

</body>
</html>
