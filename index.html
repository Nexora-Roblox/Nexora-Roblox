<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexora Access</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f8fafc;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Login Box */
.login-box {
    background: white;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    text-align: center;
    width: 300px;
}

.login-box h2 {
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border-radius: 10px;
    border: 1px solid #e2e8f0;
}

button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

.error {
    color: red;
    margin-top: 10px;
    display: none;
}
</style>
</head>

<body>

<div class="login-box">
    <h2>Nexora Access</h2>
    <input type="password" id="passcode" placeholder="Enter passcode">
    <button onclick="checkPass()">Enter</button>
    <div class="error" id="error">Wrong passcode</div>
</div>

<script>
const PASSCODE = "nexora123"; // 🔑 CHANGE THIS

function checkPass() {
    const input = document.getElementById("passcode").value;

    if (input === PASSCODE) {
        window.location.href = "staffdashboard.html";
    } else {
        document.getElementById("error").style.display = "block";
    }
}
</script>

</body>
</html>
